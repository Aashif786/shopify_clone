name: Deploy CALCart to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to Production VPS (caldimproducts.com/calcart)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 📋 Commit information
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "📌 Commit: $COMMIT_SHA"
          echo "👤 Author: $COMMIT_ACTOR"
          echo "💬 Message: $COMMIT_MSG"

      - name: 🔒 Validate required deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Missing required deployment secrets. VPS_HOST, VPS_USER, and VPS_SSH_KEY must all be configured."
            exit 1
          fi
          echo "✅ Required deployment secrets are configured."

      - name: 🚀 Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_COMMIT_SHA
          command_timeout: 18m
          script: |
            echo "=========================================="
            echo " Starting CALCart Deployment on VPS"
            echo " Commit: $DEPLOY_COMMIT_SHA"
            echo "=========================================="
            cd /var/www/calcart
            chmod +x deploy.sh
            ./deploy.sh
          script_stop: true

      - name: 🎉 Deployment succeeded
        if: success()
        run: |
          echo "🎉 DEPLOY SUCCESSFUL!"
          echo "🌐 Live at: https://caldimproducts.com/calcart"

      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ DEPLOYMENT FAILED!"
          echo "Check GitHub Actions step log above."
          echo "On VPS, view deploy log with: tail -n 100 /var/www/calcart/deploy.log"
