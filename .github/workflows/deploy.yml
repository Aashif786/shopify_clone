name: Deploy CALCart to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to Production VPS (caldimproducts.com/calcart)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4

      - name: 📋 Commit information
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "📌 Commit: $COMMIT_SHA"
          echo "👤 Author: $COMMIT_ACTOR"
          echo "💬 Message: $COMMIT_MSG"

      - name: 🔒 Validate required deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          MISSING=0
          if [ -z "$VPS_HOST" ]; then
            echo "::error::Secret 'VPS_HOST' is empty or missing."
            MISSING=1
          else
            echo "✅ VPS_HOST is configured."
          fi
          if [ -z "$VPS_USER" ]; then
            echo "::error::Secret 'VPS_USER' is empty or missing."
            MISSING=1
          else
            echo "✅ VPS_USER is configured."
          fi

          if [ -n "$VPS_SSH_KEY" ]; then
            echo "✅ VPS_SSH_KEY is configured (SSH Key auth enabled)."
          elif [ -n "$VPS_PASSWORD" ]; then
            echo "✅ VPS_PASSWORD is configured (Password auth enabled)."
          else
            echo "::error::Neither 'VPS_SSH_KEY' nor 'VPS_PASSWORD' is configured. You must provide at least one authentication secret."
            MISSING=1
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "==================================================================="
            echo "🚨 DEPLOYMENT SECRETS CHECK FAILED"
            echo "==================================================================="
            echo "Please check the following in your GitHub repository settings:"
            echo "1. Verify secrets are in 'Settings -> Secrets and variables -> Actions -> Repository secrets' (NOT Environment secrets, and NOT Variables tab)."
            echo "2. Check exact names: VPS_HOST, VPS_USER, and at least one of VPS_SSH_KEY or VPS_PASSWORD (case-sensitive)."
            echo "3. If you have multiple remotes/forks, verify secrets are set in this repository: $GITHUB_REPOSITORY"
            echo "==================================================================="
            exit 1
          fi
          echo "✅ All required deployment secrets are verified."

      - name: 🚀 Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_COMMIT_SHA
          command_timeout: 18m
          script: |
            echo "=========================================="
            echo " Starting CALCart Deployment on VPS"
            echo " Commit: $DEPLOY_COMMIT_SHA"
            echo "=========================================="
            cd /var/www/calcart
            chmod +x deploy.sh
            ./deploy.sh
          script_stop: true

      - name: 🎉 Deployment succeeded
        if: success()
        run: |
          echo "🎉 DEPLOY SUCCESSFUL!"
          echo "🌐 Live at: https://caldimproducts.com/calcart"

      - name: ❌ Deployment failed
        if: failure()
        run: |
          echo "❌ DEPLOYMENT FAILED!"
          echo "Check GitHub Actions step log above."
          echo "On VPS, view deploy log with: tail -n 100 /var/www/calcart/deploy.log"
