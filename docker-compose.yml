services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopify_clone_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopify_clone_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - shopify_clone_pgdata:/var/lib/postgresql/data

volumes:
  shopify_clone_pgdata:
